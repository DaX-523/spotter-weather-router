# Fly.io settings for the API (artifacts/INFRA.md). Deploy from backend/ with `fly deploy`.
# DJANGO_SECRET_KEY and TOMTOM_API_KEY are set with `fly secrets set`, never in this file.
# If the app name is taken, pick another and change it here, in DJANGO_ALLOWED_HOSTS below, in
# the health check's Host header and in frontend/vercel.json.
app = "spotter-weather-router"
# Chicago: the middle of the US, where the drivers are.
primary_region = "ord"

[env]
  DJANGO_DEBUG = "false"
  DJANGO_ALLOWED_HOSTS = "spotter-weather-router.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine always runs, so no plan waits for a cold start and the time-zone data to load.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

    # The check calls the machine directly: name the app, so Django's ALLOWED_HOSTS accepts it,
    # and say HTTPS, so it isn't redirected (a check never follows a redirect).
    [http_service.checks.headers]
      Host = "spotter-weather-router.fly.dev"
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
